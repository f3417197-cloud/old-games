<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لعبة السيرك القديمة</title>
    <style>
        body { background: #111; color: #fff; text-align: center; font-family: sans-serif; margin: 0; padding: 10px; }
        .score-board { font-size: 20px; font-weight: bold; color: #ff5722; margin: 10px 0; }
        canvas { background: #333; display: block; margin: 10px auto; border: 4px solid #ff5722; border-radius: 10px; max-width: 95%; }
        .btn { padding: 15px 40px; font-size: 18px; background: #ff5722; color: white; border: none; border-radius: 25px; cursor: pointer; font-weight: bold; text-decoration: none; display: inline-block; margin-top: 10px; }
    </style>
</head>
<body>
    <h1>🦁 لعبة السيرك الكلاسيكية 🦁</h1>
    <p>اضغط على زر القفز لمساعدة المهرج لتخطى براميل النار!</p>
    <div class="score-board">🎪 الحواجز المتخطاة: <span id="circusScore">0</span></div>
    <canvas id="circusCanvas" width="320" height="200"></canvas>
    <button class="btn" onclick="circusJump()">إقفز الآن! 🚀</button>
    <br><br>
    <a href="index.html" class="btn" style="background:#555;">⬅ العودة للرئيسية</a>

    <script>
        const canvas = document.getElementById("circusCanvas");
        const ctx = canvas.getContext("2d");
        let player = { x: 40, y: 130, dy: 0, jumping: false }, fire = { x: 320, speed: 4 }, score = 0;

        function circusJump() { if (!player.jumping) { player.jumping = true; player.dy = -9; } }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "#777"; ctx.fillRect(0, 160, canvas.width, 40); // الأرض
            ctx.fillStyle = "#00a2ff"; ctx.fillRect(player.x, player.y, 25, 30); // المهرج
            ctx.fillStyle = "#ff5722"; ctx.fillRect(fire.x, 135, 15, 25); // نار
        }

        function update() {
            if (player.jumping) { player.dy += 0.5; player.y += player.dy; if (player.y >= 130) { player.y = 130; player.jumping = false; } }
            fire.x -= fire.speed; if (fire.x < -20) { fire.x = 320; score++; document.getElementById("circusScore").innerText = score; fire.speed += 0.2; }
            if (fire.x < player.x + 25 && fire.x + 15 > player.x && player.y + 30 > 135) { alert("انتهى العرض! النتيجة: " + score); score = 0; fire.x = 320; fire.speed = 4; document.getElementById("circusScore").innerText = 0; }
        }
        function loop() { draw(); update(); requestAnimationFrame(loop); }
        loop();
    </script>
</body>
</html>
